<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>music player</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🎵 ST Music Player</h1>

    <!-- Search -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search for a song or artist">
      <button id="search-btn">Search</button>
    </div>

    <div class="main-content">

      <!-- Search Results -->
      <div class="results">
        <h2>Search Results</h2>
        <div id="results-list">
          <!-- JavaScript will create song cards here -->
        </div>
      </div>

      <!-- Music Player -->
      <div class="player">
        <img id="cover" src="https://placehold.co/300x300?text=Music" alt="Album Cover">
        <h2 id="song-title">Select a Song</h2>
        <h3 id="artist-name">Artist Name</h3>
        <audio id="audio-player" controls></audio>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
